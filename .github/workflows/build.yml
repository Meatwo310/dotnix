name: Build and Check

on:
  workflow_dispatch:
  push:
  pull_request:

concurrency:
  group: build-and-check
  cancel-in-progress: false

jobs:
  check:
    name: Check configuration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: cachix/install-nix-action@96951a368ba55167b55f1c916f7d416bac6505fe # v31.10.3
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check flake
        run: nix flake check

  build-heavy:
    name: Build heavy packages (${{ matrix.package }})
    needs: check
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - linux-surface-stable
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: cachix/install-nix-action@96951a368ba55167b55f1c916f7d416bac6505fe # v31.10.3
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: |
            cores = 0
            accept-flake-config = true

      - uses: cachix/cachix-action@1eb2ef646ac0255473d23a5907ad7b04ce94065c # v17
        with:
          name: meatwo310-dotnix
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          skipPush: >-
            ${{
              secrets.CACHIX_AUTH_TOKEN == '' ||
              !(
                (github.event_name == 'push' &&
                 github.ref == 'refs/heads/main') ||
                (github.event_name == 'pull_request' &&
                 github.actor == 'dependabot[bot]' &&
                 startsWith(github.head_ref, 'dependabot/nix/'))
              )
            }}

      - name: Check disk space
        run: df -h

      - name: Build ${{ matrix.package }}
        run: |
          nix build .#packages.x86_64-linux.${{ matrix.package }} \
            --print-build-logs \
            --no-link

      - name: Upload ${{ matrix.package }} to Cachix
        if: >-
          (github.event_name == 'push' &&
           github.ref == 'refs/heads/main') ||
          (github.event_name == 'pull_request' &&
           github.actor == 'dependabot[bot]' &&
           startsWith(github.head_ref, 'dependabot/nix/'))
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
        run: |
          if [[ -z "$CACHIX_AUTH_TOKEN" ]]; then
            echo "CACHIX_AUTH_TOKEN is not configured; skipping upload"
            exit 0
          fi
          nix path-info --recursive .#packages.x86_64-linux.${{ matrix.package }} \
            | cachix push meatwo310-dotnix

      - name: Check disk space after build
        if: always()
        run: df -h

  build:
    name: Build ${{ matrix.configuration }} (${{ matrix.host }})
    needs: build-heavy
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - host: sp9-v7
            runner: ubuntu-latest
            configuration: nixosConfigurations
          - host: gaming-wsl
            runner: ubuntu-latest
            configuration: nixosConfigurations
          - host: m2air
            runner: macos-latest
            configuration: darwinConfigurations
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: cachix/install-nix-action@96951a368ba55167b55f1c916f7d416bac6505fe # v31.10.3
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: |
            accept-flake-config = true

      # - uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7.0.2
      #   with:
      #     primary-key: nix-${{ runner.os }}-build-${{ matrix.host }}-${{ hashFiles('**/*.nix', '**/flake.lock') }}
      #     restore-prefixes-first-match: nix-${{ runner.os }}-build-${{ matrix.host }}-
      #     gc-max-store-size-linux: 10G
      #     purge: true
      #     purge-prefixes: nix-${{ runner.os }}-build-${{ matrix.host }}-
      #     purge-created: 0
      #     purge-last-accessed: P1DT12H
      #     purge-primary-key: never

      - uses: cachix/cachix-action@1eb2ef646ac0255473d23a5907ad7b04ce94065c # v17
        with:
          name: meatwo310-dotnix
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          skipPush: >-
            ${{
              secrets.CACHIX_AUTH_TOKEN == '' ||
              !(
                (github.event_name == 'push' &&
                 github.ref == 'refs/heads/main') ||
                (github.event_name == 'pull_request' &&
                 github.actor == 'dependabot[bot]' &&
                 startsWith(github.head_ref, 'dependabot/nix/'))
              )
            }}

      - name: Build ${{ matrix.host }}
        run: |
          nix build .#${{ matrix.configuration }}.${{ matrix.host }}.config.system.build.toplevel \
            --print-build-logs \
            --no-link
